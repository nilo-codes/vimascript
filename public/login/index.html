<!DOCTYPE html>
<html lang="fa" dir="rtl" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به حساب</title>
    <link rel="stylesheet" href="./../styles/style.css">
    <link rel="stylesheet" href="./../styles/app.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="../fonts/iranYekan/WebFonts/css/style.css">
</head>
<body class="bg-[#f2f5fc] dark:bg-[#262631] overflow-hidden">
    <main class="w-full max-w-[92rem] mx-auto px-4">
        <section class="login-container display-flex h-[100vh] flex-col">
            <div class="login-card w-full max-w-[400px]">
                <div class="login-logo flex justify-self-center mb-[30px]">
                    <img src="../images/file.1736631603.77232.webp" alt="" class="w-[150px] visible dark:hidden">
                    <img src="../images/file.1736631627.57705.webp" alt="" class="w-[150px] hidden dark:block">
                </div>
                <div class="login-box w-full bg-white dark:bg-[#353542] p-8 rounded-2xl">
                    <div class="login-header mb-10">
                        <h2 class="text-gray-400">
                            <span class="font-bold text-gray-950 dark:text-white">ورود به حساب</span> یا<span class="font-bold text-gray-950 dark:text-white"> ثبت نام</span>
                        </h2>
                    </div>
                    <form action="" class="login-form flex flex-col gap-6">
                        <input type="tel" minlength="11" maxlength="11" required placeholder="شماره موبایل همراه با صفر" class="w-full max-w-[350px] box-border outline-none text-center p-3 border border-gray-200 rounded-2xl bg-[#fafafa] placeholder:text-gray-400 dark:text-white text-[14px] dark:bg-[#414150] dark:border-[#262631] dark:caret-white focus:border-blue-300">
                        <button type="submit" class="w-full max-w-[350px] bg-blue-600 text-white p-2.5 rounded-2xl cursor-pointer font-bold hover:bg-blue-500 dark:hover:bg-blue-700 transition-colors duration-300">ادامه</button>
                    </form>
                    <div class="login-footer text-[13px] mt-[15px] text-gray-700 dark:text-white">
                        <p class="mb-4">ورود به سایت به منزله قبول <a href="#" class="text-cyan-500 cursor-pointer">قوانین و شرایط </a> میباشد.</p>
                        <a href="#" class="text-cyan-400 font-bold">ورود با گذرواژه</a>
                    </div>

                </div>
                <a href="../user/dashboard/index.html"></a>
            </div>
            <div class="login-navigation mt-[20px] text-[#aaa] text-[13px] display-flex gap-2.5">
                <a href="#" class="login-navigation-link">صفحه نخست</a>
                <span class="login-navigation-separator">•</span>
                <a href="#" class="login-navigation-link">آرشیو محصولات</a>
            </div>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
